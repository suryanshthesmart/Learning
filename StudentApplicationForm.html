<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student application form</title>
</head>
<body>
    <header><h1>Welcome to KIET college</h1></header>
    <form>
        <fieldset>
            <legend><h2>Student Registration Form</h2></legend>
            <h2>Registration Window</h2>
            <label for="Name">Name : </label>
            <input type="Name" id="Name" name="Name" placeholder="Enter your name : "><br>
            <label for="Father's Name">Father's Name : </label>
            <input type="Father's Name" id="Name" name="Father's Name" placeholder="Enter your father's name : "><br>
            <label for="Mother's Name">Mother's Name : </label>
            <input type="Name" id="Mother's Name" name="Mother's Name" placeholder="Enter your mother's name : "><br>
            <label for="Number">Number : </label>
            <input type="Number" id="Number" name="Number" placeholder="Enter your Number : "><br>
            <label for="Email">Email : </label>
            <input type="Email" id="Email" name="Email" placeholder="Enter your email"><br>
            <label for="Address">Address : </label>
            <input type="Address" id="Address" name="Address" placeholder="Enter your Address : "><br>
            <label for="dob" >Date of Birth: </label>
            <input type="date" id="dob" name="dob" placeholder="enter your date of birth"><br>
              <label for="Course" >Course: </label>
        <select id= "Course" name="Course">
            <option>Bca</option>
            <option>B.tech</option>
            <option>Mca</option>
            <option>M.tech</option>
            <option>B.pharma</option>
            <option>M.pharma</option>
            </select>
        <br>
        <label>Gender: </label>
        <input type="radio" id="male"
        name="gender" value="male">
        <label for="male">male</label><br>
        
        <input type="radio" id="female"
        name="gender" value="female">
        <label for="female">female</label><br>
         
        <input type="radio" id="other"
        name="gender" value="other">
        <label for="other">other</label><br>
        <table border="10">
        <tr>
            <th>Courses</th><th>fees(per annum )</th><th>Duration</th>
        </tr>
         <tr>
            <td>B.tech</td><td>2,00,000</td><td>4 years</td>
        </tr>
         <tr>
            <td>M.tech</td><td>3,00,000</td><td>2 years</td>
        </tr>
         <tr>
            <td>Bca</td><td>1,00,000</td><td>3 years</td>
        </tr>
         <tr>
            <td>Mca</td><td>1,50,000</td><td>2 years</td>
        </tr>
         <tr>
            <td>B.pharma</td><td>50,000</td><td>3 years</td>
        </tr>
         <tr>
            <td>M.pharma</td><td>60,000</td><td>3 years</td>
        </tr>
    </table><br>
<input type="submit" value="finish">
        </fieldset>
    </form>
</body>
</html>
